name: Build and deploy site to GitHub Pages

on:
  push:
    # Pilot branch only for now. Add `main` here at cutover, once the Next.js
    # site replaces the old root-level HTML files on the live site.
    branches: [Sai/nextjs-pilot]
  workflow_dispatch:
  # The Directory sends this when a project, person, or recruitment entry is published.
  repository_dispatch:
    types: [content-published]
  # Nightly rebuild as a backup in case a publish event is missed.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # URL prefix for the site. The default serves it at
      # https://<owner>.github.io/haag-project-explorer/. Set the repository
      # variable BASE_PATH to "/" to serve it from the root of a domain.
      BASE_PATH: ${{ vars.BASE_PATH || '/haag-project-explorer' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
